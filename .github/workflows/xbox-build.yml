name: Xbox Build (NXDK)

on:
  push:
    branches: [ "port" ]
  pull_request:
    branches: [ "port" ]
  workflow_dispatch:

jobs:
  build-xbox-xbe:
    name: "Build XBE (original Xbox via NXDK)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull NXDK Docker image
        run: docker pull ghcr.io/xboxdev/nxdk:latest

      - name: Probe NXDK container layout
        run: |
          docker run --rm \
            --entrypoint /bin/sh \
            ghcr.io/xboxdev/nxdk:latest \
            -c '
              echo "=== NXDK root ==="
              ls "$NXDK_DIR/"

              echo ""
              echo "=== bin/ ==="
              ls "$NXDK_DIR/bin/" 2>/dev/null || echo "(empty or missing)"

              echo ""
              echo "=== tools/ ==="
              ls "$NXDK_DIR/tools/" 2>/dev/null || echo "(empty or missing)"

              echo ""
              echo "=== include/ ==="
              ls "$NXDK_DIR/include/" 2>/dev/null || echo "(no include dir)"
              echo "=== share/ first level ==="
              ls "$NXDK_DIR/share/" 2>/dev/null || echo "(no share dir)"

              echo ""
              echo "=== static libs ==="
              find "$NXDK_DIR/lib" -maxdepth 2 \( -name "*.a" -o -name "*.lib" \) | sort

              echo ""
              echo "=== zlib.h location ==="
              find "$NXDK_DIR" -name "zlib.h" 2>/dev/null | head -5

              echo ""
              echo "=== xboxkrnl header location ==="
              find "$NXDK_DIR" -name "xboxkrnl.h" 2>/dev/null | head -5

              echo ""
              echo "=== pbkit header location ==="
              find "$NXDK_DIR" -name "pbkit.h" 2>/dev/null | head -5

              echo ""
              echo "=== SDL.h location ==="
              find "$NXDK_DIR" -name "SDL.h" 2>/dev/null | head -5

              echo ""
              echo "=== pbkit.h full content ==="
              cat "$NXDK_DIR/lib/pbkit/pbkit.h" 2>/dev/null | head -200 || echo "(not found)"

              echo ""
              echo "=== nv_regs.h: depth/scissor/combiner/texture/vertex defines ==="
              find "$NXDK_DIR" -name "nv_regs.h" \
                -exec grep -n "DEPTH_WRITE\|DEPTH_MASK\|SCISSOR\|WINDOW_CLIP\|COMBINER_COLOR_ICW\|COMBINER_COLOR_OCW\|COMBINER_ALPHA_ICW\|COMBINER_ALPHA_OCW\|SET_TEXTURE_OFFSET\|SET_TEXTURE_FORMAT\|SET_TEXTURE_ADDRESS\|SET_TEXTURE_CONTROL0\|SET_TEXTURE_FILTER\|SET_TEXTURE_IMAGE_RECT\|DIFFUSE_COLOR\|SPECULAR_COLOR\|VERTEX4F\|TEXCOORD0_2F\|VERTEX_DATA4UB" {} \; \
                2>/dev/null | grep "^[0-9]*:#   define" | head -60 || echo "(nv_regs.h not found)"

              echo ""
              echo "=== nv2a / kelvin header defines (all define lines) ==="
              find "$NXDK_DIR" \( -name "nv2a*.h" -o -name "kelvin*.h" -o -name "nv20*.h" \) \
                -exec grep -n "define\|include" {} \; 2>/dev/null | head -100 || true

              echo ""
              echo "=== pbkit header directory ==="
              ls "$NXDK_DIR/lib/pbkit/" 2>/dev/null

              echo ""
              echo "=== SDL_GameControllerSetPlayerIndex in SDL2 ==="
              grep -rn "SDL_GameControllerSetPlayerIndex\|GameControllerSetPlayerIndex" \
                "$NXDK_DIR/lib/sdl" 2>/dev/null | head -5 || echo "(not found)"

              echo ""
              echo "=== SDL version ==="
              grep -r "SDL_MAJOR_VERSION\|SDL_MINOR_VERSION\|SDL_PATCHLEVEL" \
                "$NXDK_DIR/lib/sdl" 2>/dev/null | grep "define" | head -5 || true

              echo ""
              echo "=== env ==="
              env | grep -i "NXDK\|LLVM\|CLANG\|PATH" || true

              echo ""
              echo "=== tools ==="
              which clang cmake make cxbe lld ld.lld lld-link 2>/dev/null || true
              clang --version 2>/dev/null | head -2

              echo ""
              echo "=== tools/llvm/bin contents ==="
              ls "$NXDK_DIR/tools/llvm/bin/" 2>/dev/null || echo "(empty or missing)"

              echo ""
              echo "=== nxdk-cc wrapper script ==="
              cat "$NXDK_DIR/bin/nxdk-cc" 2>/dev/null || echo "(not found)"

              echo ""
              echo "=== nxdk-cxx wrapper script ==="
              cat "$NXDK_DIR/bin/nxdk-cxx" 2>/dev/null || echo "(not found)"

              echo ""
              echo "=== nxdk-link wrapper script ==="
              cat "$NXDK_DIR/bin/nxdk-link" 2>/dev/null || echo "(not found)"
            '

      - name: Build XBE inside NXDK container
        run: |
          # NXDK image is Alpine-based (no bash).  Bypass its entrypoint
          # (which calls "exec bash $@") with --entrypoint /bin/sh.
          # NXDK is at /usr/src/nxdk; libs are built via cmake as part of
          # our project (add_subdirectory style) rather than pre-compiled.
          docker run --rm \
            --entrypoint /bin/sh \
            -v "${{ github.workspace }}":"${{ github.workspace }}" \
            -w "${{ github.workspace }}" \
            ghcr.io/xboxdev/nxdk:latest \
            -eux -c '
              export NXDK_DIR=/usr/src/nxdk
              export PATH="$NXDK_DIR/tools/llvm/bin:$NXDK_DIR/bin:$PATH"
              echo "NXDK_DIR=$NXDK_DIR"
              clang --version

              cmake \
                -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-nxdk.cmake \
                -DNXDK_DIR="$NXDK_DIR" \
                -DCMAKE_BUILD_TYPE=Debug \
                -B build-xbox \
                .

              cmake --build build-xbox --parallel "$(nproc)" > /tmp/build.log 2>&1 || {
                echo "=== BUILD ERRORS (grep) ===" >&2
                grep -i "error\|failed\|cannot\|lld:\|undefined\|FATAL" /tmp/build.log | head -80 >&2 || true
                echo "=== FIRST 30 LINES ===" >&2
                head -30 /tmp/build.log >&2
                echo "=== LAST 80 LINES ===" >&2
                tail -80 /tmp/build.log >&2
                echo "=== BUILD DIR ===" >&2
                ls -la build-xbox/ >&2
                exit 1
              }
              tail -20 /tmp/build.log
              echo "XBE size: $(stat -c%s build-xbox/default.xbe) bytes"
            '

      - name: Upload XBE artifact
        uses: actions/upload-artifact@v4
        with:
          name: pd-xbox-xbe
          path: build-xbox/default.xbe
          retention-days: 7
          if-no-files-found: error

      - name: Build instructions summary
        if: success()
        run: |
          echo "## Xbox XBE built successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Create a testable ISO" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the \`pd-xbox-xbe\` artifact (contains \`default.xbe\`)" >> $GITHUB_STEP_SUMMARY
          echo "2. Obtain \`pd.ntsc-final.z64\` (Perfect Dark USA v1.1, 32 MB)" >> $GITHUB_STEP_SUMMARY
          echo "3. Run the packer:" >> $GITHUB_STEP_SUMMARY
          echo "   \`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "   python scripts/pack-xiso.py --xbe default.xbe --rom pd.ntsc-final.z64" >> $GITHUB_STEP_SUMMARY
          echo "   \`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "4. Load \`perfectdarkx.iso\` into XEMU: **Machine → Settings → DVD**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See \`XBOX_PORT_PLAN.md\` for expected output at each phase (0–11)." >> $GITHUB_STEP_SUMMARY
